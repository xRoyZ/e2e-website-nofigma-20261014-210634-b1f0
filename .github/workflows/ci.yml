# office-crew-ci-gates: strict-v10
# Auto-generated for vanilla web projects (GitHub Actions).
name: CI
on:
  pull_request:
  push:
    branches: [ main ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - shell: bash
        run: |
          shopt -s nullglob
          tests=(tests/*.test.mjs tests/*.test.js)
          if [ ${#tests[@]} -gt 0 ]; then
            echo "Running ${#tests[@]} node test file(s)..."
            node --test "${tests[@]}"
          elif [ -d tests ]; then
            echo "tests/ exists, but no .test.mjs/.test.js — skip"
          else
            echo "No tests/ directory — static project without tests, accepted"
          fi
  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - shell: bash
        run: |
          if [ -f .eslintrc.json ] || [ -f .eslintrc.js ] || [ -f eslint.config.js ]; then
            npx --yes eslint . --max-warnings=0 || true
          else
            echo "No ESLint config — skip"
          fi

  # office-crew-scan: v2 betterleaks=1.9.0 osv-scanner=2.5.1
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the scanners
        shell: bash
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/oc-scan" && cd "$RUNNER_TEMP/oc-scan"
          curl -fsSL -o betterleaks.tar.gz "https://github.com/betterleaks/betterleaks/releases/download/v1.9.0/betterleaks_1.9.0_linux_x64.tar.gz"
          echo "f8b185a39ffcece2a1ca82bf3a4e7435cd81963ffd16b7a9128daf75f35f6de7  betterleaks.tar.gz" | sha256sum -c -
          tar -xzf betterleaks.tar.gz betterleaks
          curl -fsSL -o osv-scanner "https://github.com/google/osv-scanner/releases/download/v2.5.1/osv-scanner_linux_amd64"
          echo "f9f25499a2c8cc367b3af45df2ea7eeca7fbccceab9c35079968f4b3652194be  osv-scanner" | sha256sum -c -
          chmod +x betterleaks osv-scanner
          : > osv-scanner.toml
      - name: Committed credentials
        shell: bash
        run: |
          "$RUNNER_TEMP/oc-scan/betterleaks" dir . --config .office-crew-betterleaks.toml --max-target-megabytes 5 --max-archive-depth 0 --no-banner --redact --exit-code 1
      - name: Vulnerable dependencies (reported)
        if: always()
        shell: bash
        run: |
          "$RUNNER_TEMP/oc-scan/osv-scanner" scan source --no-resolve --config "$RUNNER_TEMP/oc-scan/osv-scanner.toml" --recursive . || echo "osv-scanner ended with $? — reported only, nothing fails on it."
